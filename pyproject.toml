[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yane"
version = "2026.1"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "pandas",
    "biopython",
    "seaborn"
]

[project.scripts]
yane = "yane.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
