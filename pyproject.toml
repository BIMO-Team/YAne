[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yane-2026.1"
version = "2026.1"
dependencies = [
    "numpy",
    "pandas",
    "biopython",
    "seaborn"
]

[project.scripts]
yane = "yane.main:main"

[tool.setuptools.packages.find]
where = ["src"]